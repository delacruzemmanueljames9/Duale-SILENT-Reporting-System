<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Duale SILENT Reporting System</title>
    <meta name="description" content="Duale SILENT Reporting System — built on Replit. Update this description to reflect the app." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Duale SILENT Reporting System" />
    <meta property="og:description" content="Duale SILENT Reporting System — built on Replit. Update this description to reflect the app." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Duale SILENT Reporting System" />
    <meta name="twitter:description" content="Duale SILENT Reporting System — built on Replit. Update this description to reflect the app." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f2f0e7;color:#193641;font-family:Inter,system-ui,sans-serif">
        <section style="max-width:520px;text-align:center">
          <p style="font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#54766b">Duale SILENT</p>
          <h1 style="font-size:clamp(32px,6vw,56px);line-height:1.05;margin:16px 0">A safe line is opening.</h1>
          <p style="font-size:16px;line-height:1.6;color:#587071">Please wait a moment.</p>
        </section>
      </main>
    </div>
    <script>
      (function () {
        function showFailure() {
          var root = document.getElementById('root');
          if (!root || root.getAttribute('data-app-mounted') === 'true') return;
          root.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f2f0e7;color:#193641;font-family:Inter,system-ui,sans-serif"><section style="max-width:520px;text-align:center"><p style="font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#54766b">Duale SILENT</p><h1 style="font-size:clamp(32px,6vw,56px);line-height:1.05;margin:16px 0">This page could not open.</h1><p style="font-size:16px;line-height:1.6;color:#587071">Please refresh once. If the problem continues, use the report channel again later or call 911 for immediate danger.</p><button onclick="location.reload()" style="margin-top:24px;border:0;border-radius:6px;padding:12px 18px;background:#bd654f;color:#fff8ef;font-weight:700;cursor:pointer">Refresh SILENT</button></section></main>';
        }
        window.addEventListener('error', showFailure);
        window.addEventListener('unhandledrejection', showFailure);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
